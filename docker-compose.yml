# docker-compose.yml — RememberGo Backend

services:
  remembergo_backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime          # Apunta al stage final del multi-stage build
    image: remembergo-backend:local
    container_name: remembergo_backend
    restart: unless-stopped

    # ── Puertos ──────────────────────────────────────────────
    # ports:
    #   - "8000:8000" # No es necesario exponerlo al host; Nginx se comunica internamente en la red de Docker

    # ── Variables de entorno ─────────────────────────────────
    env_file:
      - .env

    # ── Healthcheck ──────────────────────────────────────────
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # ── Límites de recursos ──────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # ── Red aislada ──────────────────────────────────────────
    networks:
      - remembergo_net

    # ── Logging ──────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx_ssl:
    container_name: nginx_ssl_remembergo
    image: nginx:latest
    tty: true
    ports:
      - "9615:443"
    volumes:
      - nginxfiles:/home/app/nginx
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    command: > 
      bash -c "
        mkdir -p /var/www/html /etc/nginx/logs /ssl &&
        cp -r /home/app/nginx/html/. /var/www/html/ 2>/dev/null || true &&
        cp -r /home/app/nginx/logs/. /etc/nginx/logs/ 2>/dev/null || true &&
        cp -r /home/app/nginx/ssl/. /ssl/ 2>/dev/null || true && 
        nginx -g 'daemon off;'
      "
    restart: always
    depends_on:
      - remembergo_backend
    networks:
      - remembergo_net

volumes:
  nginxfiles:
    external: true

networks:
  remembergo_net:
    driver: bridge
