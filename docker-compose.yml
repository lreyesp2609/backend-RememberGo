# docker-compose.yml — RutAI Backend
# Nota: el campo `version:` fue eliminado (obsoleto desde Compose V2)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime          # Apunta al stage final del multi-stage build
    image: rutai-backend:local
    container_name: rutai_api
    restart: unless-stopped

    # ── Puertos ──────────────────────────────────────────────
    ports:
      - "8000:8000"

    # ── Variables de entorno ─────────────────────────────────
    # Las variables sensibles se inyectan desde el archivo .env
    # que NO se copia en la imagen (está en .dockerignore).
    # En producción (Render, K8s), inyectar via secrets del orquestador.
    env_file:
      - .env

    # ── Healthcheck ──────────────────────────────────────────
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # ── Límites de recursos ──────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    # ── Red aislada ──────────────────────────────────────────
    networks:
      - rutai_net

    # ── Logging ──────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rutai_net:
    driver: bridge
